name: Keep Streamlit Awake

on:
  schedule:
    - cron: '0 */4 * * *'  # Her 4 saatte bir
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s https://YOUR-APP-URL.streamlit.app > /dev/null
          echo "App pinged successfully"
